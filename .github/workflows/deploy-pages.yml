name: Desplegar Frontend PWA en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Permisos requeridos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garantizar un solo despliegue concurrente a la vez
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar carpeta frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
